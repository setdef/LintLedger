version = 1

# An SPDX header is only for a file copied under a copyleft or share-alike
# license. This file declares the copyright and license of every other file:
# Alibi's own, under MIT and CC-BY-4.0, and any copied under a permissive
# license from a project with the same owner. Where two entries match a
# file, the later one wins, and a header inside a file wins over both.

# Code and configuration: every file no later entry matches.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 setdef"
SPDX-License-Identifier = "MIT"

# Documentation: every page.
[[annotations]]
path = ["**/*.md"]
SPDX-FileCopyrightText = "2026 setdef"
SPDX-License-Identifier = "CC-BY-4.0"
