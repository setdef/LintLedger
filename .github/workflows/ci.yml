# The gate (`bundle exec rake`) on Linux, macOS, and Windows, for every push to trunk.
name: CI

on:
  push:
    branches: [trunk]

permissions:
  contents: read

# Every push to trunk gets a run of its own, and nothing cancels it. A group
# shared by all of trunk's runs leaves one run going and one waiting, and a
# newer push cancels the waiting run even with cancel-in-progress off, so
# under frequent pushes almost no run finished. Here a trunk run's group is its
# commit, so runs go side by side and every commit's run finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # mise installs Ruby from jdx/ruby's precompiled builds. false makes a
  # missing build fail the job, where mise would otherwise compile Ruby from
  # source.
  MISE_RUBY_COMPILE: "false"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # mise's own timeouts, 20 s to fetch the list of remote versions and 30 s
  # for a request, cut off a download on a slow runner.
  MISE_HTTP_TIMEOUT: 120s
  MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 120s

jobs:
  gate:
    name: Gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml pins the tools contributors use: Ruby, the REUSE tool,
      # actionlint, and shellcheck. CI installs the same pins.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11

      # Windows' Ruby is RubyInstaller's, with the DLLs and the MSYS2 its gems
      # compile with, all from mise.toml.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: runner.os == 'Windows'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          version: 2026.10.11
          add_shims_to_path: false
          mise_dir: ${{ runner.temp }}\mise

      # After mise-action has installed mise.toml's Ruby and MSYS2 and exported
      # their environment, this gives Windows the rest of what ridk enable gives.
      - name: Give Windows' Ruby the rest of its environment
        if: runner.os == 'Windows'
        run: .github/scripts/windows-ruby-env.sh

      - name: Install the bundle
        run: bundle install

      - name: Run the gate
        run: bundle exec rake
